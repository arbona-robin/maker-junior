<svg xmlns="http://www.w3.org/2000/svg" width="200mm" height="120mm" viewBox="0 0 200 120" font-family="Helvetica, Arial, sans-serif">
  <title>Le chemin d'un message entre les lampes et le tableau de bord</title>
  <rect width="200" height="120" fill="#fff"/>

  <!-- Les lampes : la 7 au premier plan, deux autres derrière -->
  <g opacity="0.35">
    <rect x="16" y="14" width="26" height="22" rx="2" fill="#c8a165" stroke="#333" stroke-width="0.5"/>
    <text x="29" y="20" font-size="3" text-anchor="middle">Lampe 3</text>
    <rect x="10" y="70" width="26" height="22" rx="2" fill="#c8a165" stroke="#333" stroke-width="0.5"/>
    <text x="23" y="76" font-size="3" text-anchor="middle">Lampe 12</text>
  </g>
  <rect x="8" y="38" width="34" height="30" rx="2" fill="#c8a165" stroke="#333" stroke-width="0.6"/>
  <rect x="13" y="44" width="24" height="14" rx="1.5" fill="#1d2433"/>
  <text x="25" y="52.5" font-size="3" fill="#fff" text-anchor="middle">micro:bit</text>
  <text x="25" y="64" font-size="3.4" text-anchor="middle" font-weight="bold">Lampe 7</text>

  <!-- Le pont -->
  <rect x="96" y="42" width="28" height="22" rx="2" fill="#1d2433" stroke="#333" stroke-width="0.6"/>
  <text x="110" y="52" font-size="3" fill="#fff" text-anchor="middle">micro:bit</text>
  <text x="110" y="57" font-size="3.4" fill="#fff" text-anchor="middle" font-weight="bold">Pont</text>

  <!-- L'ordinateur et le tableau de bord -->
  <rect x="146" y="30" width="46" height="32" rx="2" fill="#1d2433" stroke="#333" stroke-width="0.6"/>
  <rect x="150" y="34" width="38" height="24" rx="1" fill="#2a3346"/>
  <rect x="153" y="37" width="15" height="17" rx="1" fill="#3a4458"/>
  <text x="160.5" y="41" font-size="2.2" fill="#fff" text-anchor="middle">Lampe 7</text>
  <path d="M156 50 A4.5 4.5 0 0 1 165 50" fill="none" stroke="#8a9cff" stroke-width="1"/>
  <rect x="171" y="37" width="15" height="17" rx="1" fill="#3a4458"/>
  <rect x="174" y="44" width="9" height="4.5" rx="2.25" fill="#2e7d32"/>
  <circle cx="180.7" cy="46.25" r="1.7" fill="#fff"/>
  <path d="M142 62 H196 L192 66 H146 Z" fill="#555"/>
  <text x="169" y="72" font-size="3.4" text-anchor="middle" font-weight="bold">Tableau de bord</text>
  <text x="169" y="76.5" font-size="2.8" text-anchor="middle" fill="#555">sur l'ordinateur de l'animateur</text>

  <!-- Câble USB -->
  <path d="M124 53 H146" stroke="#222" stroke-width="1.4" fill="none"/>
  <text x="135" y="51" font-size="2.8" text-anchor="middle">USB</text>

  <!-- Ondes radio autour de la lampe 7 et du pont -->
  <g fill="none" stroke="#999" stroke-width="0.5">
    <path d="M46 46 A8 8 0 0 1 46 60"/><path d="M49 43 A12 12 0 0 1 49 63"/>
    <path d="M92 46 A8 8 0 0 0 92 60"/><path d="M89 43 A12 12 0 0 0 89 63"/>
  </g>
  <text x="69" y="56" font-size="3" text-anchor="middle" fill="#555">radio, bande 40</text>

  <!-- Mesures : de la lampe vers le tableau de bord -->
  <path d="M44 40 C60 28, 80 28, 96 42" fill="none" stroke="#f9a825" stroke-width="1.4"/>
  <path d="M96 42 l-4.2 -0.4 l2.4 -3.2 z" fill="#f9a825"/>
  <text x="70" y="24" font-size="3.2" text-anchor="middle" fill="#b07800" font-weight="bold">lum = 120 · inter7 = 1</text>
  <text x="70" y="28" font-size="2.8" text-anchor="middle" fill="#b07800">toutes les 5 s, avec le numéro de série</text>

  <!-- Ordre : du tableau de bord vers la lampe -->
  <path d="M96 64 C80 78, 60 78, 44 66" fill="none" stroke="#2e7d32" stroke-width="1.4"/>
  <path d="M44 66 l4.2 0.2 l-2.2 3.3 z" fill="#2e7d32"/>
  <text x="70" y="83" font-size="3.2" text-anchor="middle" fill="#2e7d32" font-weight="bold">inter7 = 0</text>
  <text x="70" y="87" font-size="2.8" text-anchor="middle" fill="#2e7d32">toutes les lampes l'entendent, seule la 7 réagit</text>

  <!-- Pont débranché -->
  <rect x="96" y="94" width="96" height="12" rx="2" fill="#f4f4f4" stroke="#ccc" stroke-width="0.4"/>
  <text x="144" y="101.3" font-size="3" text-anchor="middle">Pont débranché : l'écran se fige, la lampe continue seule.</text>

  <!-- Légende -->
  <g font-size="3">
    <line x1="10" y1="114" x2="18" y2="114" stroke="#f9a825" stroke-width="1.4"/>
    <text x="21" y="115">mesures envoyées par la lampe</text>
    <line x1="88" y1="114" x2="96" y2="114" stroke="#2e7d32" stroke-width="1.4"/>
    <text x="99" y="115">ordre envoyé par le tableau de bord</text>
  </g>
</svg>
