<svg xmlns="http://www.w3.org/2000/svg" width="200mm" height="150mm" viewBox="0 0 200 150" font-family="Helvetica, Arial, sans-serif">
  <title>Schéma électrique du montage de la séance 2</title>
  <rect width="200" height="150" fill="#fff"/>

  <!-- Fils -->
  <g fill="none" stroke-width="1.4" stroke-linejoin="round">
    <!-- + du pack vers V -->
    <path d="M50 28 H140" stroke="#d32f2f"/>
    <!-- − du pack : vers G et vers GND du micro:bit -->
    <path d="M30 60 V135 H120 V118" stroke="#222"/>
    <path d="M120 118 V40 H140" stroke="#222"/>
    <!-- P1 vers DI -->
    <path d="M110 94 H132 V55 H140" stroke="#f9a825"/>
    <!-- P2 vers la bande A -->
    <path d="M110 102 H150" stroke="#2e7d32"/>
    <!-- GND vers la bande B -->
    <path d="M110 118 H150" stroke="#222"/>
    <!-- boîtier 2 × AAA vers micro:bit -->
    <path d="M60 98 H70" stroke="#d32f2f"/>
    <path d="M60 106 H70" stroke="#222"/>
  </g>
  <g fill="#222">
    <circle cx="120" cy="118" r="1.6"/>
  </g>

  <!-- Pack d'accus -->
  <rect x="10" y="20" width="40" height="40" rx="2" fill="#eee" stroke="#333" stroke-width="0.6"/>
  <g stroke="#333" stroke-width="0.8">
    <line x1="18" y1="37" x2="18" y2="43" stroke-width="1.6"/><line x1="21" y1="34" x2="21" y2="46"/>
    <line x1="21" y1="40" x2="26" y2="40"/>
    <line x1="26" y1="37" x2="26" y2="43" stroke-width="1.6"/><line x1="29" y1="34" x2="29" y2="46"/>
    <line x1="29" y1="40" x2="34" y2="40"/>
    <line x1="34" y1="37" x2="34" y2="43" stroke-width="1.6"/><line x1="37" y1="34" x2="37" y2="46"/>
    <line x1="37" y1="40" x2="45" y2="40"/>
    <rect x="40" y="38" width="5" height="4" fill="none" stroke-dasharray="0.8,0.6" stroke-width="0.4"/>
  </g>
  <text x="30" y="26" font-size="3" text-anchor="middle">Pack : 3 accus + fausse pile</text>
  <text x="30" y="54" font-size="2.8" text-anchor="middle" fill="#555">3,6 V</text>
  <text x="52" y="26.5" font-size="3.4" fill="#d32f2f" font-weight="bold">+</text>
  <text x="32" y="64" font-size="3.4" font-weight="bold">−</text>

  <!-- Matrice -->
  <rect x="140" y="15" width="50" height="50" rx="2" fill="#1d2433" stroke="#333" stroke-width="0.6"/>
  <g fill="#3a4458">
    <rect x="150" y="22" width="34" height="34"/>
  </g>
  <g stroke="#1d2433" stroke-width="0.6">
    <line x1="154.25" y1="22" x2="154.25" y2="56"/><line x1="158.5" y1="22" x2="158.5" y2="56"/>
    <line x1="162.75" y1="22" x2="162.75" y2="56"/><line x1="167" y1="22" x2="167" y2="56"/>
    <line x1="171.25" y1="22" x2="171.25" y2="56"/><line x1="175.5" y1="22" x2="175.5" y2="56"/>
    <line x1="179.75" y1="22" x2="179.75" y2="56"/>
    <line x1="150" y1="26.25" x2="184" y2="26.25"/><line x1="150" y1="30.5" x2="184" y2="30.5"/>
    <line x1="150" y1="34.75" x2="184" y2="34.75"/><line x1="150" y1="39" x2="184" y2="39"/>
    <line x1="150" y1="43.25" x2="184" y2="43.25"/><line x1="150" y1="47.5" x2="184" y2="47.5"/>
    <line x1="150" y1="51.75" x2="184" y2="51.75"/>
  </g>
  <text x="167" y="62" font-size="3" text-anchor="middle" fill="#fff">Matrice 8 × 8</text>
  <g font-size="3" fill="#fff" font-weight="bold">
    <text x="142" y="29">V</text>
    <text x="142" y="41">G</text>
    <text x="142" y="56">DI</text>
  </g>

  <!-- micro:bit -->
  <rect x="70" y="80" width="40" height="45" rx="3" fill="#1d2433" stroke="#333" stroke-width="0.6"/>
  <text x="90" y="77" font-size="3.4" text-anchor="middle">micro:bit</text>
  <text x="90" y="130" font-size="2.6" text-anchor="middle" fill="#888">P0 et 3V : libres</text>
  <g font-size="3" fill="#fff" font-weight="bold" text-anchor="end">
    <text x="108" y="87" fill="#888">P0</text>
    <text x="108" y="95">P1</text>
    <text x="108" y="103">P2</text>
    <text x="108" y="111" fill="#888">3V</text>
    <text x="108" y="119">GND</text>
  </g>

  <!-- Boîtier 2 × AAA -->
  <rect x="34" y="86" width="26" height="26" rx="2" fill="#eee" stroke="#333" stroke-width="0.6"/>
  <text x="47" y="91" font-size="3" text-anchor="middle">2 × AAA</text>
  <g stroke="#333" stroke-width="0.8">
    <line x1="41" y1="99" x2="41" y2="105" stroke-width="1.6"/><line x1="44" y1="96" x2="44" y2="108"/>
    <line x1="44" y1="102" x2="49" y2="102"/>
    <line x1="49" y1="99" x2="49" y2="105" stroke-width="1.6"/><line x1="52" y1="96" x2="52" y2="108"/>
  </g>
  <text x="62" y="96" font-size="3.4" fill="#d32f2f" font-weight="bold">+</text>
  <text x="62" y="111" font-size="3.4" font-weight="bold">−</text>

  <!-- Bandes de cuivre de la séance 1 -->
  <rect x="150" y="99" width="42" height="6" fill="#c87533"/>
  <rect x="150" y="115" width="42" height="6" fill="#c87533"/>
  <text x="171" y="96.5" font-size="2.8" text-anchor="middle">bandes du dessus</text>
  <text x="171" y="103.2" font-size="2.6" text-anchor="middle" fill="#fff">bouton</text>
  <text x="171" y="119.2" font-size="2.6" text-anchor="middle" fill="#fff">masse</text>

  <!-- Fils internes des boîtiers : du + de la dernière pile au +, du − de la première au − -->
  <g fill="none" stroke-width="1" stroke-linejoin="round">
    <path d="M45 40 H48 V28 H50" stroke="#d32f2f"/>
    <path d="M18 40 H14 V57 H30 V60" stroke="#222"/>
    <path d="M52 102 H56 V98 H60" stroke="#d32f2f"/>
    <path d="M41 102 H38 V109 H56 V106 H60" stroke="#222"/>
  </g>

  <!-- Annotations -->
  <text x="95" y="25" font-size="2.8" text-anchor="middle" fill="#d32f2f">alimentation de la matrice</text>
  <text x="118" y="60" font-size="2.8" text-anchor="end">masse commune</text>
  <text x="134" y="72" font-size="2.8" fill="#b28704">signal</text>
  <text x="122" y="92.5" font-size="2.4" fill="#b28704">écrou 1</text>
  <text x="42.5" y="49" font-size="2" text-anchor="middle" fill="#555">fausse pile</text>
  <text x="131" y="100.5" font-size="2.4" fill="#2e7d32" text-anchor="middle">piste P2 et vis</text>
  <text x="137" y="116.5" font-size="2.4" text-anchor="middle">piste GND et vis</text>
  <text x="121" y="124" font-size="2.4">écrou GND</text>

  <!-- Légende -->
  <g font-size="2.8">
    <line x1="10" y1="144" x2="18" y2="144" stroke="#d32f2f" stroke-width="1.4"/><text x="20" y="145">+ du pack</text>
    <line x1="48" y1="144" x2="56" y2="144" stroke="#222" stroke-width="1.4"/><text x="58" y="145">masse</text>
    <line x1="78" y1="144" x2="86" y2="144" stroke="#f9a825" stroke-width="1.4"/><text x="88" y="145">signal de la matrice</text>
    <line x1="128" y1="144" x2="136" y2="144" stroke="#2e7d32" stroke-width="1.4"/><text x="138" y="145">bouton de cuivre</text>
  </g>
</svg>
