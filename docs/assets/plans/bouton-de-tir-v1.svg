</text><text x="22" y="256" font-size="3.3" font-family="Helvetica, Arial, sans-serif">Colle le ruban de cuivre côté imprimé, sur les deux bandes orange : elles se retrouvent face à face, sans se toucher.</text><text x="22" y="262" font-size="3.3" font-family="Helvetica, Arial, sans-serif">Deux élastiques tiennent le bouton fermé. Le capuchon se colle de l'autre côté, sur le cercle.</text><text x="22" y="268" font-size="3.3" font-family="Helvetica, Arial, sans-serif">Une pince mord le cuivre à droite, l'autre à gauche, jamais du côté où le cuivre s'arrête avant le bord.</text><text x="22" y="280" font-size="3.3" font-family="Helvetica, Arial, sans-serif">Imprimer en A4 portrait, à 100 % : vérifier à la règle que la pièce fait 55 mm de large.</text><text x="198" y="289" font-size="3" fill="#777" text-anchor="end" font-family="Helvetica, Arial, sans-serif">Bouton de tir · v1 · échelle 1</text></svg>
