site_name: Le livre Maker Junior
site_description: Le support écrit des ateliers Maker Junior — fabrication, électronique et programmation.
site_author: Robin Arbona
site_url: https://maker.arbona.dev/
docs_dir: docs

theme:
  name: material
  language: fr
  icon:
    logo: material/robot-mower
  favicon: assets/favicon.png
  features:
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Passer en mode sombre
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: deep orange
      toggle:
        icon: material/weather-sunny
        name: Passer en mode clair

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - tables
  - footnotes
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.keys
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.caret
  - pymdownx.mark
  - toc:
      permalink: true
      toc_depth: 3

plugins:
  - search:
      lang: fr
  - callouts
  - glightbox:
      touchNavigation: true
      loop: false
      effect: zoom
      zoomable: true
      draggable: true

extra_css:
  - assets/css/extra.css

extra:
  social:
    - icon: material/github
      link: https://github.com/
      name: Le dépôt du livre

