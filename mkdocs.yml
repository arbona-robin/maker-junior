site_name: Le livre Maker Junior
site_description: Le support écrit des ateliers Maker Junior — fabrication, électronique et programmation.
site_author: Robin Arbona
site_url: https://maker.arbona.dev/
docs_dir: docs

theme:
  name: material
  language: fr
  icon:
    logo: material/robot-mower
  favicon: assets/favicon.png
  features:
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Passer en mode sombre
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: deep orange
      toggle:
        icon: material/weather-sunny
        name: Passer en mode clair

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - tables
  - footnotes
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.keys
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.caret
  - pymdownx.mark
  - toc:
      permalink: true
      toc_depth: 3

plugins:
  - search:
      lang: fr
  - callouts
  - glightbox:
      touchNavigation: true
      loop: false
      effect: zoom
      zoomable: true
      draggable: true

extra_css:
  - assets/css/extra.css

extra:
  social:
    - icon: material/github
      link: https://github.com/
      name: Le dépôt du livre

nav:
  - Accueil: index.md
  - Projet Rover:
      - projets/rover/index.md
      - "Séance 1 — La base motrice": projets/rover/seances/s01-base-motrice.md
      - "Séance 2 — Ton rover obéit": projets/rover/seances/s02-ton-rover-obeit.md
      - "Séance 3 — Identité et télécommande": projets/rover/seances/s03-identite-et-telecommande.md
      - "Séance 4 — Pilote ton rover à distance": projets/rover/seances/s04-pilote-a-distance.md
  - Fiches:
      - fiches/index.md
      - "Sécurité à l'atelier": fiches/securite-atelier.md
      - "Tracer, découper, plier le carton": fiches/carton-tracer-decouper-plier.md
      - "La carte DFR0548": fiches/carte-dfr0548.md
      - "Rouler droit et tourner": fiches/rouler-droit.md
      - "Prendre en main MakeCode": fiches/makecode-prise-en-main.md
      - "L'extension DF-Driver": fiches/extension-df-driver.md
      - "Modéliser et imprimer en 3D": fiches/modeliser-imprimer-3d.md
      - "D'une mesure à une décision": fiches/mesure-vers-decision.md
      - "Quand ça ne marche pas": fiches/depannage.md
  - Carnet de bord:
      - carnet-de-bord/index.md
      - Rover:
          - "Séance 1": carnet-de-bord/rover-s01.md
          - "Séance 2": carnet-de-bord/rover-s02.md
          - "Séance 3": carnet-de-bord/rover-s03.md
          - "Séance 4": carnet-de-bord/rover-s04.md
